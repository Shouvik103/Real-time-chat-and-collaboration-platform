# =============================================================================
# GitHub Actions CI/CD Pipeline — Test, Frontend Build & Encryption Engine
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Backend Tests & Prisma Validation ──────────────────────────────

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Run Jest tests with coverage
        run: npm test -- --coverage
        env:
          JWT_SECRET: test-ci-jwt-secret-min-32-characters-long
          JWT_REFRESH_SECRET: test-ci-jwt-refresh-secret-min-32-chars
          NODE_ENV: test
          BCRYPT_SALT_ROUNDS: "4"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: services/auth-service/coverage/
          retention-days: 7

  # ─── Job 2: Frontend Build Verification ────────────────────────────────────

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite production bundle
        run: npm run build
        env:
          VITE_API_URL: https://16-192-218-162.sslip.io
          VITE_SOCKET_URL: https://16-192-218-162.sslip.io

  # ─── Job 3: C++ Encryption Engine Build Verification ───────────────────────

  encryption-engine-build:
    name: C++ Encryption Engine Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Encryption Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: services/encryption-engine
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
